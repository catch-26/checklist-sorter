name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Validate manifest and bundles
        run: .github/scripts/validate.sh
      - name: Package plugin
        run: .github/scripts/package.sh "$(jq -r .version manifest.json)" checklist-sorter.jpl
